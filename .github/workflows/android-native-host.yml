name: Android native host prototype
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-native-host-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android-host:
    name: Android ARM64 native host
    env:
      CCACHE_DIR: ${{ github.workspace }}/.compiler-cache-android
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: coccofresco/TriAevum
          ref: 17218b0cfdb944645bb5cde5249f313dca7e53ce
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v5
        id: native_cache
        with:
          path: .compiler-cache-android
          key: native-android-arm64-v1-${{ github.sha }}
          restore-keys: native-android-arm64-v1-
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache nlohmann-json3-dev
          python -m pip install 'cmake==3.31.6' ninja
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
      - name: Apply Android port fixes
        run: |
          python tools/native/apply_android_port.py engine
          python tools/reframed/apply_native_port.py engine
          python tools/reframed/apply_renderer_port.py engine
          python tools/native/apply_audio_port.py engine
          python tools/frontend/apply_frontend_port.py engine
      - name: Check packed integer vertex inputs
        run: |
          c++ -std=c++20 -I engine/runtime/three_ds_recomp/include tests/pica_vertex_packing.cpp engine/runtime/three_ds_recomp/src/fast/oot3d/pica_nri_vertex_input.cpp -o vertex-packing-test
          ./vertex-packing-test
      - name: Check mobile input and responsive layout
        run: |
          c++ -std=c++20 tests/mobile_touch.cpp -o mobile-touch-test
          ./mobile-touch-test
          c++ -std=c++20 tests/touch_game_axes.cpp -o touch-game-axes-test
          ./touch-game-axes-test
          c++ -std=c++20 -Itests/lifecycle_stub tests/mobile_lifecycle.cpp -o mobile-lifecycle-test
          ./mobile-lifecycle-test
          c++ -std=c++20 tests/mobile_menu_scale.cpp -o mobile-menu-scale-test
          ./mobile-menu-scale-test
          c++ -std=c++20 tests/touch_hud.cpp -o touch-hud-test
          ./touch-hud-test
          c++ -std=c++20 tests/settings_categories.cpp -o settings-categories-test
          ./settings-categories-test
          c++ -std=c++20 tests/render_resolution.cpp -o render-resolution-test
          ./render-resolution-test
          c++ -std=c++20 tests/texture_memory.cpp -o texture-memory-test
          ./texture-memory-test
          c++ -std=c++20 tests/output_gain.cpp -o output-gain-test
          ./output-gain-test
          c++ -std=c++20 tests/texture_folder.cpp -o texture-folder-test
          ./texture-folder-test
          c++ -std=c++20 -I engine/tools/oot3d/native_game_runtime -I engine/tools/three_ds/input tests/control_persistence.cpp engine/tools/oot3d/native_game_runtime/oot3d_native_control_config.cpp engine/tools/three_ds/input/three_ds_input.cpp engine/tools/three_ds/input/three_ds_motion_composition.cpp -o control-persistence-test
          ./control-persistence-test
          c++ -std=c++20 tests/startup_layout.cpp -o startup-layout-test
          ./startup-layout-test
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py'
      - name: Configure neutral native host
        run: |
          cmake -S engine/ports/android/runtime -B build/host -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=." \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=." \
            -DTHREE_DS_RECOMP_ENABLE_IMMERSE=OFF \
            -DTHREE_DS_RECOMP_ENABLE_NRI_UPSCALER_SDKS=OFF \
            -DTHREE_DS_RECOMP_ENABLE_DLSS_MODULE=OFF
      - name: Check remote and controller menu navigation
        run: |
          c++ -std=c++20 -I build/host/_deps/imgui-src tests/menu_navigation.cpp build/host/_deps/imgui-src/imgui.cpp build/host/_deps/imgui-src/imgui_draw.cpp build/host/_deps/imgui-src/imgui_tables.cpp build/host/_deps/imgui-src/imgui_widgets.cpp -o menu-navigation-test
          ./menu-navigation-test
          c++ -std=c++20 -I build/host/_deps/imgui-src tests/settings_navigation.cpp build/host/_deps/imgui-src/imgui.cpp build/host/_deps/imgui-src/imgui_draw.cpp build/host/_deps/imgui-src/imgui_tables.cpp build/host/_deps/imgui-src/imgui_widgets.cpp -o settings-navigation-test
          ./settings-navigation-test
          c++ -std=c++20 -I build/host/_deps/imgui-src tests/television_remote.cpp -o television-remote-test
          ./television-remote-test
      - name: Build neutral native host
        run: cmake --build build/host --parallel 3 --target oot3d_native_game oot3d_native_pica_frontend_tests
      - name: Stage neutral libraries
        run: python tools/native/stage_android_host.py --engine engine --build build/host --ndk "$ANDROID_HOME/ndk/29.0.14206865" --output artifacts/Ocarina-ReTuned-Native-Android-arm64.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: Ocarina-ReTuned-Native-Android-arm64-${{ github.sha }}
          path: artifacts/Ocarina-ReTuned-Native-Android-arm64.tar.gz
          if-no-files-found: error
      - uses: actions/cache/save@v5
        if: always() && steps.native_cache.outputs.cache-hit != 'true'
        with:
          path: .compiler-cache-android
          key: native-android-arm64-v1-${{ github.sha }}
