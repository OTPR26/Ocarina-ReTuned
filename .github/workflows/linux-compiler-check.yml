name: Released desktop package checks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: Linux-x86_64, runner: ubuntu-24.04}
          - {platform: Linux-ARM64, runner: ubuntu-24.04-arm}
          - {platform: Windows-x64, runner: windows-2025}
          - {platform: Windows-ARM64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test the published package
        run: python tools/native/check_preview_desktop.py ${{ matrix.platform }}
