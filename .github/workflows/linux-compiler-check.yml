name: Version corrected desktop packages
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 tools/native/version_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: Desktop-hotfix-0.8.1
          path: hotfix/*.zip
          retention-days: 3
