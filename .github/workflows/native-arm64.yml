name: Native ARM64 prototype
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: both
        options: [both, macos, android]
permissions:
  contents: read
concurrency:
  group: native-arm64-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  macos-services:
    name: macOS ARM64 services
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: coccofresco/TriAevum
          ref: 17218b0cfdb944645bb5cde5249f313dca7e53ce
          path: engine
          persist-credentials: false
      - name: Build native module services
        run: |
          test "$(uname -m)" = arm64
          cmake -S engine/runtime/triaevum_module -B build/services -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build/services --parallel 3 --target triaevum_input_service_tests triaevum_audio_service_tests triaevum_filesystem_service_tests triaevum_module_tests triaevum_tam_metadata_tests triaevum_native_module_loader_tests triaevum_pica_service_adapter_tests
      - name: Run native service tests
        run: |
          set -e
          for test in triaevum_input_service_tests triaevum_audio_service_tests triaevum_filesystem_service_tests triaevum_module_tests triaevum_tam_metadata_tests triaevum_pica_service_adapter_tests; do
            build/services/"$test"
          done
          build/services/triaevum_native_module_loader_tests build/services/triaevum_mock_module.dylib
  macos-runtime:
    name: macOS ARM64 runtime
    env:
      CCACHE_DIR: ${{ github.workspace }}/.compiler-cache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: coccofresco/TriAevum
          ref: 17218b0cfdb944645bb5cde5249f313dca7e53ce
          path: engine
          persist-credentials: false
      - uses: actions/cache/restore@v5
        id: native_cache
        with:
          path: .compiler-cache
          key: native-macos-arm64-v1-${{ github.sha }}
          restore-keys: native-macos-arm64-v1-
      - name: Install native dependencies
        run: brew install ccache ninja cmake sdl2 glew libzip libpng nlohmann-json tinyxml2 spdlog libogg libvorbis opus opusfile shaderc molten-vk vulkan-loader vulkan-headers dylibbundler
      - name: Apply macOS port fixes
        run: |
          python3 tools/native/apply_macos_port.py engine
          python3 tools/reframed/apply_native_port.py engine
          python3 tools/reframed/apply_renderer_port.py engine
          python3 tools/native/apply_audio_port.py engine
          python3 tools/frontend/apply_frontend_port.py engine
          clang++ -std=c++20 -fsanitize=address,undefined tests/native_audio_buffer.cpp -o native-audio-buffer-test
          ./native-audio-buffer-test
          clang++ -std=c++20 -Iengine/tools/oot3d/native_game_runtime -Iengine/tools/oot3d/typed_gameplay -Iengine/tools/oot3d/native_a32_runtime/upstream/recomp tests/native_audio_timing.cpp engine/tools/oot3d/native_game_runtime/oot3d_native_frame_rate.cpp -o native-audio-timing-test
          ./native-audio-timing-test
          clang++ -std=c++20 tests/reframed_scissor.cpp -o reframed-scissor-test
          ./reframed-scissor-test
          clang++ -std=c++20 -Iengine/tools/oot3d/native_a32_runtime/upstream/recomp tests/reframed_vfp_zero.cpp engine/tools/oot3d/native_a32_runtime/upstream/recomp/a32_vfp_binary64.cpp -o reframed-vfp-test
          ./reframed-vfp-test
          clang++ -std=c++20 tools/native/numeric_probe.cpp -o numeric-probe
          ./numeric-probe
      - name: Configure neutral runtime
        run: |
          cmake -S engine -B build/runtime -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.4 \
            -DCMAKE_C_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=." \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=. -fexperimental-library" \
            -DOOT3D_WHOLE_AOT_PRODUCT_MODE=ON -DOOT3D_DIRECT_AOT_PLUGIN=ON \
            -DOOT3D_ENABLE_VULKAN_RENDERER=ON -DTHREE_DS_RECOMP_ENABLE_NRI=ON \
            -DTHREE_DS_RECOMP_ENABLE_IMMERSE=OFF \
            -DTHREE_DS_RECOMP_ENABLE_NRI_UPSCALER_SDKS=OFF \
            -DTHREE_DS_RECOMP_ENABLE_DLSS_MODULE=OFF \
            -DTHREE_DS_RECOMP_ENABLE_SSSR=OFF -DTHREE_DS_RECOMP_ENABLE_CACAO=OFF \
            -DTHREE_DS_RECOMP_OFFER_EXPERIMENTAL_GI=OFF \
            -DENABLE_SCRIPTING=OFF -DINCLUDE_MPQ_SUPPORT=OFF
      - name: Build neutral runtime
        run: |
          cmake --build build/runtime --parallel 3 --target triaevum_public_runtime oot3d_native_a32_ctr_host_tests
          build/runtime/oot3d_native_a32_ctr_host_tests
      - name: Bundle neutral prototype
        run: python3 tools/native/package_macos.py --engine engine --build build/runtime --output artifacts/Ocarina-ReTuned-Native-macOS-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Ocarina-ReTuned-Native-macOS-arm64-${{ github.sha }}
          path: artifacts/Ocarina-ReTuned-Native-macOS-arm64.zip
          if-no-files-found: error
      - uses: actions/cache/save@v5
        if: always() && steps.native_cache.outputs.cache-hit != 'true'
        with:
          path: .compiler-cache
          key: native-macos-arm64-v1-${{ github.sha }}
  android-services:
    name: Android ARM64 services
    if: inputs.platform != 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: coccofresco/TriAevum
          ref: 17218b0cfdb944645bb5cde5249f313dca7e53ce
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install build tools
        run: |
          python -m pip install 'cmake==3.31.6' ninja
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
      - name: Cross-build neutral Android services
        env:
          TRIAEVUM_BUILD_DIR: ${{ github.workspace }}/build/android
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" bash engine/scripts/build-android-native.sh
  android-renderer:
    name: Android ARM64 renderer
    if: inputs.platform != 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: coccofresco/TriAevum
          ref: 17218b0cfdb944645bb5cde5249f313dca7e53ce
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install build tools
        run: |
          python -m pip install 'cmake==3.31.6' ninja
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
      - name: Cross-build neutral Android renderer
        env:
          TRIAEVUM_ANDROID_RENDERER_BUILD_DIR: ${{ github.workspace }}/build/android-renderer
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" bash engine/scripts/build-android-renderer.sh
